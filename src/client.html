<script>
  const state = {
    schema: null,
    dashboard: null,
    dashboardOverview: null,
    dashboardCurrency: 'USD',
    portfolios: [],
    openPositions: [],
    closedPositions: [],
    tradingAnalytics: null,
    holdings: [],
    holdingsSummary: null,
    priceCache: [],
    watchlist: [],
  };

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('[data-action="refresh"]').addEventListener('click', loadBootstrap);
    document.querySelector('[data-action="init"]').addEventListener('click', initializeSheets);
    document.querySelector('[data-action="create-snapshot"]').addEventListener('click', createDailySnapshot);
    document.querySelector('[data-action="new-portfolio"]').addEventListener('click', resetPortfolioForm);
    document
      .querySelector('[data-action="clear-portfolio-form"]')
      .addEventListener('click', resetPortfolioForm);
    document.querySelector('[data-portfolio-form]').addEventListener('submit', savePortfolio);
    document.querySelector('[data-manual-entry-form]').addEventListener('submit', saveManualEntry);
    document.querySelector('[data-position-form]').addEventListener('submit', savePosition);
    document.querySelector('[data-position-close-form]').addEventListener('submit', closePosition);
    document.querySelector('[data-position-scale-form]').addEventListener('submit', scaleOutPosition);
    document.querySelector('[data-action="new-holding"]').addEventListener('click', resetHoldingForm);
    document.querySelector('[data-action="clear-holding-form"]').addEventListener('click', resetHoldingForm);
    document.querySelector('[data-holding-form]').addEventListener('submit', saveHolding);
    document.querySelector('[data-price-cache-form]').addEventListener('submit', saveManualPrice);
    document.querySelector('[data-watchlist-form]').addEventListener('submit', addWatchlistSymbol);

    document.querySelectorAll('[data-view-tab]').forEach((tab) => {
      tab.addEventListener('click', () => activateView(tab.dataset.viewTab));
    });
    document.querySelectorAll('[data-dashboard-currency] [data-currency]').forEach((button) => {
      button.addEventListener('click', () => setDashboardCurrency(button.dataset.currency));
    });

    setToday();
    loadBootstrap();
  });

  function loadBootstrap() {
    setStatus('Loading');

    google.script.run
      .withSuccessHandler((bootstrap) => {
        state.schema = bootstrap.schema;
        state.dashboard = bootstrap.dashboard;
        state.dashboardOverview = bootstrap.dashboardOverview || {};
        state.dashboardCurrency = state.dashboardOverview.currency || state.dashboardCurrency;
        state.portfolios = bootstrap.portfolios || [];
        state.openPositions = bootstrap.openPositions || [];
        state.closedPositions = bootstrap.closedPositions || [];
        state.tradingAnalytics = bootstrap.tradingAnalytics || {};
        state.holdings = bootstrap.holdings || [];
        state.holdingsSummary = bootstrap.holdingsSummary || {};
        state.priceCache = bootstrap.priceCache || [];
        state.watchlist = bootstrap.watchlist || [];
        renderSheetList(bootstrap.schema.sheets);
        renderDashboardOverview(state.dashboardOverview);
        renderPortfolios(state.portfolios);
        renderPositions(state.openPositions, state.closedPositions);
        renderTradingAnalytics(state.tradingAnalytics);
        renderHoldings(state.holdings, state.holdingsSummary);
        renderPriceCache(state.priceCache);
        renderWatchlist(state.watchlist);
        setStatus(
          bootstrap.portfolioError ||
            bootstrap.positionError ||
            bootstrap.holdingError ||
            bootstrap.dashboardOverviewError ||
            `${bootstrap.schema.sheets.length} required sheets configured`,
          Boolean(
            bootstrap.portfolioError ||
              bootstrap.positionError ||
              bootstrap.holdingError ||
              bootstrap.dashboardOverviewError
          )
        );
      })
      .withFailureHandler(handleFailure)
      .getAppBootstrap();
  }

  function initializeSheets() {
    setStatus('Initializing');

    google.script.run
      .withSuccessHandler((result) => {
        renderSheetList(result.sheets);
        setStatus(formatInitStatus(result));
        loadBootstrap();
      })
      .withFailureHandler(handleFailure)
      .initializeLedger();
  }

  function setDashboardCurrency(currency) {
    state.dashboardCurrency = currency === 'THB' ? 'THB' : 'USD';
    document.querySelectorAll('[data-dashboard-currency] [data-currency]').forEach((button) => {
      button.classList.toggle('is-active', button.dataset.currency === state.dashboardCurrency);
    });

    setStatus('Loading dashboard');
    google.script.run
      .withSuccessHandler((overview) => {
        state.dashboardOverview = overview;
        renderDashboardOverview(overview);
        setStatus('Dashboard updated');
      })
      .withFailureHandler(handleFailure)
      .getDashboardOverviewApi({ currency: state.dashboardCurrency });
  }

  function createDailySnapshot() {
    setStatus('Creating snapshot');

    google.script.run
      .withSuccessHandler(() => {
        loadBootstrap();
        setStatus('Snapshot saved');
      })
      .withFailureHandler(handleFailure)
      .createDailySnapshotApi({});
  }

  function savePortfolio(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = formToObject(form);
    const portfolioId = payload.portfolio_id;

    if (payload.type === 'manual' && payload.initial_capital === '') {
      delete payload.initial_capital;
    }

    const runner = google.script.run
      .withSuccessHandler(() => {
        resetPortfolioForm();
        loadBootstrap();
        setStatus('Portfolio saved');
      })
      .withFailureHandler(handleFailure);

    if (portfolioId) {
      delete payload.portfolio_id;
      runner.updatePortfolioApi(portfolioId, payload);
    } else {
      runner.createPortfolioApi(payload);
    }
  }

  function saveManualEntry(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = formToObject(form);

    if (!payload.portfolio_id) {
      setStatus('Create a manual portfolio before saving an entry', true);
      return;
    }

    google.script.run
      .withSuccessHandler(() => {
        form.reset();
        setToday();
        loadBootstrap();
        setStatus('Manual entry saved');
      })
      .withFailureHandler(handleFailure)
      .addManualEntryApi(payload);
  }

  function savePosition(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = formToObject(form);

    if (!payload.portfolio_id) {
      setStatus('Create a trading portfolio before saving a position', true);
      return;
    }

    removeBlankFields(payload);

    google.script.run
      .withSuccessHandler(() => {
        form.reset();
        setToday();
        renderPositionPortfolioSelect(state.portfolios);
        loadBootstrap();
        setStatus('Position saved');
      })
      .withFailureHandler(handleFailure)
      .createPositionApi(payload);
  }

  function closePosition(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = formToObject(form);
    const positionId = payload.position_id;

    if (!positionId) {
      setStatus('Select an open position to close', true);
      return;
    }

    delete payload.position_id;
    removeBlankFields(payload);

    google.script.run
      .withSuccessHandler(() => {
        form.reset();
        setToday();
        setPositionActionForms(null);
        loadBootstrap();
        setStatus('Position closed');
      })
      .withFailureHandler(handleFailure)
      .closePositionApi(positionId, payload);
  }

  function scaleOutPosition(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = formToObject(form);
    const positionId = payload.position_id;

    if (!positionId) {
      setStatus('Select an open position to scale out', true);
      return;
    }

    delete payload.position_id;
    removeBlankFields(payload);

    google.script.run
      .withSuccessHandler(() => {
        form.reset();
        setToday();
        setPositionActionForms(null);
        loadBootstrap();
        setStatus('Scale-out saved');
      })
      .withFailureHandler(handleFailure)
      .scaleOutPositionApi(positionId, payload);
  }

  function saveHolding(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = formToObject(form);
    const holdingId = payload.holding_id;

    delete payload.holding_id;
    removeBlankFields(payload);

    const runner = google.script.run
      .withSuccessHandler(() => {
        resetHoldingForm();
        loadBootstrap();
        setStatus('Holding saved');
      })
      .withFailureHandler(handleFailure);

    if (holdingId) {
      runner.updateHoldingApi(holdingId, payload);
    } else {
      runner.createHoldingApi(payload);
    }
  }

  function saveManualPrice(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = formToObject(form);

    google.script.run
      .withSuccessHandler(() => {
        form.reset();
        form.elements.currency.value = 'USD';
        loadBootstrap();
        setStatus('Manual price saved');
      })
      .withFailureHandler(handleFailure)
      .upsertManualPriceApi(payload);
  }

  function addWatchlistSymbol(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = formToObject(form);

    google.script.run
      .withSuccessHandler(() => {
        form.reset();
        loadBootstrap();
        setStatus('Watchlist updated');
      })
      .withFailureHandler(handleFailure)
      .addWatchlistSymbolApi(payload);
  }

  function removeWatchlistSymbol(symbol, source) {
    google.script.run
      .withSuccessHandler(() => {
        loadBootstrap();
        setStatus('Watchlist symbol removed');
      })
      .withFailureHandler(handleFailure)
      .removeWatchlistSymbolApi(symbol, source);
  }

  function archivePortfolio(portfolioId) {
    const portfolio = state.portfolios.find((item) => item.portfolio_id === portfolioId);
    const name = portfolio ? portfolio.name : 'this portfolio';

    if (!confirm(`Archive ${name}?`)) {
      return;
    }

    google.script.run
      .withSuccessHandler(() => {
        loadBootstrap();
        setStatus('Portfolio archived');
      })
      .withFailureHandler(handleFailure)
      .archivePortfolioApi(portfolioId);
  }

  function archiveHolding(holdingId) {
    const holding = state.holdings.find((item) => item.holding_id === holdingId);
    const name = holding ? holding.symbol : 'this holding';

    if (!confirm(`Archive ${name}?`)) {
      return;
    }

    google.script.run
      .withSuccessHandler(() => {
        loadBootstrap();
        setStatus('Holding archived');
      })
      .withFailureHandler(handleFailure)
      .archiveHoldingApi(holdingId);
  }

  function editPortfolio(portfolioId) {
    const portfolio = state.portfolios.find((item) => item.portfolio_id === portfolioId);
    if (!portfolio) {
      return;
    }

    const form = document.querySelector('[data-portfolio-form]');
    fillForm(form, portfolio);
    document.querySelector('[data-portfolio-form-title]').textContent = 'Edit portfolio';
    activateView('portfolios');
  }

  function editHolding(holdingId) {
    const holding = state.holdings.find((item) => item.holding_id === holdingId);
    if (!holding) {
      return;
    }

    const form = document.querySelector('[data-holding-form]');
    fillForm(form, holding);
    document.querySelector('[data-holding-form-title]').textContent = 'Edit holding';
    activateView('holdings');
  }

  function renderDashboard(summary) {
    if (summary.has_mixed_currencies) {
      document.querySelector('[data-dashboard-total]').textContent = formatCurrencyBreakdown(
        summary.totals_by_currency
      );
      document.querySelector('[data-dashboard-trading]').textContent = formatCurrencyBreakdown(
        summary.trading_by_currency
      );
      document.querySelector('[data-dashboard-manual]').textContent = formatCurrencyBreakdown(
        summary.manual_by_currency
      );
      return;
    }

    const currency = summary.currency || 'USD';
    document.querySelector('[data-dashboard-total]').textContent = formatMoney(summary.total_value, currency);
    document.querySelector('[data-dashboard-trading]').textContent = formatMoney(summary.trading_value, currency);
    document.querySelector('[data-dashboard-manual]').textContent = formatMoney(summary.manual_value, currency);
  }

  function renderDashboardOverview(overview) {
    const data = overview || {};
    const currency = data.currency || state.dashboardCurrency || 'USD';
    const totals = data.totals || {};
    const todayPnl = data.today_pnl || {};

    state.dashboardCurrency = currency;
    document.querySelectorAll('[data-dashboard-currency] [data-currency]').forEach((button) => {
      button.classList.toggle('is-active', button.dataset.currency === currency);
    });

    document.querySelector('[data-dashboard-total]').textContent = formatMoney(
      totals.total_portfolio_value_display || 0,
      currency
    );
    document.querySelector('[data-dashboard-today-pnl]').textContent = formatSignedMoney(
      todayPnl.value_display || 0,
      currency
    );
    document.querySelector('[data-dashboard-pnl-label]').textContent = todayPnl.label || 'No snapshot yet';
    document.querySelector('[data-dashboard-trading]').textContent = formatMoney(
      totals.trading_balance_display || 0,
      currency
    );
    document.querySelector('[data-dashboard-holdings]').textContent = formatMoney(
      totals.holdings_value_display || 0,
      currency
    );

    renderDashboardAllocation(data.allocation || [], currency);
    renderDashboardPortfolioSummary(data.portfolios || [], currency, data.fx || {});
    renderDashboardPnlOverview(data.pnl_overview || []);
    renderDashboardGrowth(data.growth || []);
    renderDashboardWarnings(data.warnings || [], data.unconverted_items || []);
  }

  function renderDashboardWarnings(warnings, unconvertedItems) {
    const list = document.querySelector('[data-dashboard-warnings]');
    list.innerHTML = '';

    warnings.forEach((warning) => {
      const item = document.createElement('p');
      item.className = 'warning-copy';
      const details = unconvertedItems.length
        ? ` ${unconvertedItems.map((entry) => `${entry.label} ${entry.currency}`).join(', ')}`
        : '';
      item.textContent = warning + details;
      list.append(item);
    });
  }

  function renderDashboardAllocation(allocation, currency) {
    const list = document.querySelector('[data-dashboard-allocation]');
    list.innerHTML = '';

    if (allocation.length === 0) {
      list.append(createEmptyText('No allocation yet'));
      return;
    }

    allocation.forEach((item) => {
      const row = document.createElement('article');
      row.className = 'allocation-row';
      const bar = document.createElement('span');
      bar.className = 'allocation-bar';
      bar.style.width = `${Math.max(4, Number(item.pct || 0) * 100)}%`;

      const label = document.createElement('strong');
      label.textContent = item.label;
      const meta = document.createElement('span');
      meta.textContent = `${item.kind} / ${formatPercent(item.pct)} / ${formatMoney(item.value_display, currency)}`;

      row.append(bar, label, meta);
      list.append(row);
    });
  }

  function renderDashboardPortfolioSummary(portfolios, currency, fx) {
    const list = document.querySelector('[data-dashboard-portfolio-summary]');
    list.innerHTML = '';

    if (portfolios.length === 0) {
      list.append(createEmptyText('No portfolios'));
      return;
    }

    portfolios.forEach((portfolio) => {
      const card = document.createElement('article');
      card.className = 'portfolio-card position-card';
      const main = document.createElement('div');
      const title = document.createElement('h3');
      title.textContent = portfolio.name;
      const meta = document.createElement('p');
      meta.textContent = `${portfolio.type} / PNL ${formatPercentOrDash(portfolio.pnl_pct, true)}`;
      main.append(title, meta);

      const value = document.createElement('strong');
      value.textContent = formatMoney(
        convertUsdForDisplay(portfolio.value_usd || 0, currency, fx),
        currency
      );

      card.append(main, value);
      list.append(card);
    });
  }

  function renderDashboardPnlOverview(rows) {
    const chart = document.querySelector('[data-dashboard-pnl-overview]');
    chart.innerHTML = '';

    if (rows.length === 0) {
      chart.append(createEmptyText('No snapshot yet'));
      return;
    }

    const max = Math.max(
      1,
      ...rows.map((row) => Math.abs(Number(row.pnl_usd || 0)))
    );

    rows.slice(-10).forEach((row) => {
      const item = document.createElement('article');
      item.className = 'chart-row';
      const label = document.createElement('span');
      label.textContent = row.date;
      const bar = document.createElement('span');
      bar.className = Number(row.pnl_usd || 0) < 0 ? 'chart-bar is-negative' : 'chart-bar';
      bar.style.width = `${Math.max(4, (Math.abs(Number(row.pnl_usd || 0)) / max) * 100)}%`;
      const value = document.createElement('strong');
      value.textContent = formatSignedMoney(row.pnl_usd, 'USD');
      item.append(label, bar, value);
      chart.append(item);
    });
  }

  function renderDashboardGrowth(rows) {
    const chart = document.querySelector('[data-dashboard-growth]');
    const historicalNote = 'Historical charts use USD snapshots.';
    chart.innerHTML = '';
    chart.dataset.note = historicalNote;

    if (rows.length < 2) {
      chart.append(createEmptyText('No snapshot yet'));
      return;
    }

    const max = Math.max(
      1,
      ...rows.map((row) => Number(row.total_portfolio_value_usd || 0))
    );

    rows.slice(-10).forEach((row) => {
      const item = document.createElement('article');
      item.className = 'chart-row';
      const label = document.createElement('span');
      label.textContent = row.date;
      const bar = document.createElement('span');
      bar.className = 'chart-bar';
      bar.style.width = `${Math.max(4, (Number(row.total_portfolio_value_usd || 0) / max) * 100)}%`;
      const value = document.createElement('strong');
      value.textContent = formatMoney(row.total_portfolio_value_usd, 'USD');
      item.append(label, bar, value);
      chart.append(item);
    });
  }

  function renderPortfolios(portfolios) {
    const list = document.querySelector('[data-portfolio-list]');
    list.innerHTML = '';

    if (portfolios.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'muted-copy';
      empty.textContent = 'No portfolios';
      list.append(empty);
    }

    portfolios.forEach((portfolio) => {
      const card = document.createElement('article');
      card.className = 'portfolio-card';

      const main = document.createElement('div');
      const title = document.createElement('h3');
      title.textContent = portfolio.name;
      const meta = document.createElement('p');
      meta.textContent = `${portfolio.type} / ${portfolio.market} / ${portfolio.base_currency}`;
      main.append(title, meta);

      const value = document.createElement('strong');
      value.textContent = formatMoney(portfolio.current_value, portfolio.current_currency || portfolio.base_currency);

      const actions = document.createElement('div');
      actions.className = 'row-actions';

      const edit = document.createElement('button');
      edit.className = 'secondary-button';
      edit.type = 'button';
      edit.textContent = 'Edit';
      edit.addEventListener('click', () => editPortfolio(portfolio.portfolio_id));

      const archive = document.createElement('button');
      archive.className = 'danger-button';
      archive.type = 'button';
      archive.textContent = 'Archive';
      archive.addEventListener('click', () => archivePortfolio(portfolio.portfolio_id));

      actions.append(edit, archive);
      card.append(main, value, actions);
      list.append(card);
    });

    renderManualPortfolioSelect(portfolios);
    renderPositionPortfolioSelect(portfolios);
  }

  function renderManualPortfolioSelect(portfolios) {
    const select = document.querySelector('[data-manual-portfolio-select]');
    const manualSubmit = document.querySelector('[data-manual-entry-submit]');
    const previous = select.value;
    select.innerHTML = '';

    portfolios
      .filter((portfolio) => portfolio.type === 'manual')
      .forEach((portfolio) => {
        const option = document.createElement('option');
        option.value = portfolio.portfolio_id;
        option.textContent = portfolio.name;
        select.append(option);
      });

    if (previous && Array.from(select.options).some((option) => option.value === previous)) {
      select.value = previous;
    } else if (select.options.length > 0) {
      select.selectedIndex = 0;
    }

    select.disabled = select.options.length === 0;
    manualSubmit.disabled = select.options.length === 0;
    manualSubmit.textContent = select.options.length === 0 ? 'No manual portfolios' : 'Save entry';
  }

  function renderPositionPortfolioSelect(portfolios) {
    const select = document.querySelector('[data-position-portfolio-select]');
    const submit = document.querySelector('[data-position-submit]');
    const previous = select.value;
    select.innerHTML = '';

    portfolios
      .filter((portfolio) => portfolio.type === 'trading')
      .forEach((portfolio) => {
        const option = document.createElement('option');
        option.value = portfolio.portfolio_id;
        option.textContent = portfolio.name;
        option.dataset.riskPercent = portfolio.default_risk_pct || '';
        select.append(option);
      });

    if (previous && Array.from(select.options).some((option) => option.value === previous)) {
      select.value = previous;
    } else if (select.options.length > 0) {
      select.selectedIndex = 0;
    }

    const selected = select.selectedOptions[0];
    const riskInput = document.querySelector('[data-position-form] input[name="risk_percent"]');
    if (selected && !riskInput.value) {
      riskInput.value = selected.dataset.riskPercent || '';
    }

    select.disabled = select.options.length === 0;
    submit.disabled = select.options.length === 0;
    submit.textContent = select.options.length === 0 ? 'No trading portfolios' : 'Save position';
  }

  function renderPositions(openPositions, closedPositions) {
    renderPositionList('[data-open-position-list]', openPositions, true);
    renderPositionList('[data-closed-position-list]', closedPositions, false);
  }

  function renderPositionList(selector, positions, isOpenList) {
    const list = document.querySelector(selector);
    list.innerHTML = '';

    if (positions.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'muted-copy';
      empty.textContent = isOpenList ? 'No open positions' : 'No closed positions';
      list.append(empty);
      return;
    }

    positions.forEach((position) => {
      const card = document.createElement('article');
      card.className = 'portfolio-card position-card';

      const main = document.createElement('div');
      const title = document.createElement('h3');
      title.textContent = `${position.symbol} ${position.direction}`;
      const meta = document.createElement('p');
      meta.textContent = isOpenList
        ? `${formatNumber(position.qty)} qty @ ${formatNumber(position.entry_price)}`
        : `${formatNumber(position.exit_qty || position.qty)} qty / PNL ${formatSignedNumber(position.realized_pnl)}`;
      main.append(title, meta);

      const value = document.createElement('strong');
      value.textContent = isOpenList
        ? formatNumber(position.position_size)
        : formatSignedNumber(position.realized_pnl);

      card.append(main, value);

      if (isOpenList) {
        const actions = document.createElement('div');
        actions.className = 'row-actions';

        const close = document.createElement('button');
        close.className = 'secondary-button';
        close.type = 'button';
        close.textContent = 'Close';
        close.addEventListener('click', () => setPositionActionForms(position));

        const scale = document.createElement('button');
        scale.className = 'secondary-button';
        scale.type = 'button';
        scale.textContent = 'Scale out';
        scale.addEventListener('click', () => setPositionActionForms(position));

        actions.append(close, scale);
        card.append(actions);
      }

      list.append(card);
    });
  }

  function setPositionActionForms(position) {
    const closeForm = document.querySelector('[data-position-close-form]');
    const scaleForm = document.querySelector('[data-position-scale-form]');
    const closeSubmit = document.querySelector('[data-position-close-submit]');
    const scaleSubmit = document.querySelector('[data-position-scale-submit]');
    const label = position ? `${position.symbol} ${formatNumber(position.qty)} qty` : '';

    closeForm.elements.position_id.value = position ? position.position_id : '';
    scaleForm.elements.position_id.value = position ? position.position_id : '';
    document.querySelector('[data-position-close-title]').textContent = position
      ? `Close ${label}`
      : 'Close position';
    document.querySelector('[data-position-scale-title]').textContent = position ? `Scale ${label}` : 'Scale out';
    closeSubmit.disabled = !position;
    scaleSubmit.disabled = !position;
    closeSubmit.textContent = position ? 'Close position' : 'Select open position';
    scaleSubmit.textContent = position ? 'Save scale-out' : 'Select open position';
  }

  function renderTradingAnalytics(analytics) {
    document.querySelector('[data-analytics-count]').textContent = formatNumber(
      analytics.closed_trade_count || 0
    );
    document.querySelector('[data-analytics-win-rate]').textContent = `${formatNumber(
      Number(analytics.win_rate || 0) * 100
    )}%`;
    document.querySelector('[data-analytics-expectancy]').textContent = formatNumber(analytics.expectancy || 0);
    document.querySelector('[data-analytics-profit-factor]').textContent = formatNumberOrDash(
      analytics.profit_factor
    );
    document.querySelector('[data-analytics-average-r]').textContent = formatNumberOrDash(
      analytics.average_r_multiple
    );
    document.querySelector('[data-analytics-largest-win]').textContent = formatNumberOrDash(
      analytics.largest_win
    );
    document.querySelector('[data-analytics-largest-loss]').textContent = formatNumberOrDash(
      analytics.largest_loss
    );
    document.querySelector('[data-analytics-loss-streak]').textContent = formatNumber(
      analytics.max_consecutive_loss || 0
    );
  }

  function renderHoldings(holdings, summary) {
    renderHoldingsSummary(summary || {});

    const list = document.querySelector('[data-holding-list]');
    const watchedSymbols = new Set((state.watchlist || []).map((item) => item.symbol));
    const sorted = holdings.slice().sort((left, right) => {
      const leftWatched = watchedSymbols.has(left.symbol) ? 0 : 1;
      const rightWatched = watchedSymbols.has(right.symbol) ? 0 : 1;
      if (leftWatched !== rightWatched) {
        return leftWatched - rightWatched;
      }
      return left.symbol.localeCompare(right.symbol);
    });

    list.innerHTML = '';

    if (sorted.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'muted-copy';
      empty.textContent = 'No holdings';
      list.append(empty);
      return;
    }

    sorted.forEach((holding) => {
      const card = document.createElement('article');
      card.className = 'portfolio-card';

      const main = document.createElement('div');
      const title = document.createElement('h3');
      title.textContent = holding.symbol;
      const meta = document.createElement('p');
      meta.textContent = `${holding.asset_type} / ${formatNumber(holding.amount)} qty / ${holding.price_label}`;
      main.append(title, meta);

      const value = document.createElement('strong');
      value.textContent = formatMoney(holding.current_value, holding.current_price_currency || holding.cost_currency);

      const actions = document.createElement('div');
      actions.className = 'row-actions';

      const edit = document.createElement('button');
      edit.className = 'secondary-button';
      edit.type = 'button';
      edit.textContent = 'Edit';
      edit.addEventListener('click', () => editHolding(holding.holding_id));

      const archive = document.createElement('button');
      archive.className = 'danger-button';
      archive.type = 'button';
      archive.textContent = 'Archive';
      archive.addEventListener('click', () => archiveHolding(holding.holding_id));

      actions.append(edit, archive);
      card.append(main, value, actions);
      list.append(card);
    });
  }

  function renderHoldingsSummary(summary) {
    if (summary.has_mixed_currencies) {
      document.querySelector('[data-holdings-current-value]').textContent = formatCurrencyBreakdown(
        summary.current_value_by_currency
      );
      document.querySelector('[data-holdings-cost-basis]').textContent = formatCurrencyBreakdown(
        summary.cost_basis_by_currency
      );
      document.querySelector('[data-holdings-pnl]').textContent = formatCurrencyBreakdown(
        summary.unrealized_pnl_by_currency
      );
      return;
    }

    const currency = summary.currency || 'USD';
    document.querySelector('[data-holdings-current-value]').textContent = formatMoney(
      summary.total_current_value || 0,
      currency
    );
    document.querySelector('[data-holdings-cost-basis]').textContent = formatMoney(
      summary.total_cost_basis || 0,
      currency
    );
    document.querySelector('[data-holdings-pnl]').textContent = formatMoney(
      summary.total_unrealized_pnl || 0,
      currency
    );
  }

  function renderPriceCache(prices) {
    const list = document.querySelector('[data-price-cache-list]');
    list.innerHTML = '';

    if (prices.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'muted-copy';
      empty.textContent = 'No manual prices';
      list.append(empty);
      return;
    }

    prices.forEach((price) => {
      const card = document.createElement('article');
      card.className = 'portfolio-card position-card';

      const main = document.createElement('div');
      const title = document.createElement('h3');
      title.textContent = price.symbol;
      const meta = document.createElement('p');
      meta.textContent = `${price.source} / ${price.updated_at || 'not updated'}`;
      main.append(title, meta);

      const value = document.createElement('strong');
      value.textContent = formatMoney(price.price, price.currency || 'USD');

      card.append(main, value);
      list.append(card);
    });
  }

  function renderWatchlist(watchlist) {
    const list = document.querySelector('[data-watchlist-list]');
    list.innerHTML = '';

    if (watchlist.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'muted-copy';
      empty.textContent = 'No watched symbols';
      list.append(empty);
      return;
    }

    watchlist.forEach((item) => {
      const row = document.createElement('article');
      row.className = 'portfolio-card';

      const main = document.createElement('div');
      const title = document.createElement('h3');
      title.textContent = item.symbol;
      const meta = document.createElement('p');
      meta.textContent = item.source;
      main.append(title, meta);

      const remove = document.createElement('button');
      remove.className = 'danger-button';
      remove.type = 'button';
      remove.textContent = 'Remove';
      remove.addEventListener('click', () => removeWatchlistSymbol(item.symbol, item.source));

      row.append(main, remove);
      list.append(row);
    });
  }

  function renderSheetList(sheets) {
    const list = document.querySelector('[data-sheet-list]');
    list.innerHTML = '';

    sheets.forEach((sheet) => {
      const card = document.createElement('article');
      card.className = 'sheet-card';

      const title = document.createElement('h2');
      title.textContent = sheet.name;

      const meta = document.createElement('p');
      meta.textContent = `${sheet.headers.length} columns`;

      card.append(title, meta);
      list.append(card);
    });
  }

  function activateView(viewName) {
    document.querySelectorAll('[data-view]').forEach((view) => {
      view.classList.toggle('is-active', view.dataset.view === viewName);
    });

    document.querySelectorAll('[data-view-tab]').forEach((tab) => {
      tab.classList.toggle('is-active', tab.dataset.viewTab === viewName);
    });
  }

  function resetPortfolioForm() {
    const form = document.querySelector('[data-portfolio-form]');
    form.reset();
    form.elements.base_currency.value = 'USD';
    form.elements.commission_rate.value = '0';
    form.elements.default_risk_pct.value = '0';
    form.elements.portfolio_id.value = '';
    document.querySelector('[data-portfolio-form-title]').textContent = 'New portfolio';
  }

  function resetHoldingForm() {
    const form = document.querySelector('[data-holding-form]');
    form.reset();
    form.elements.holding_id.value = '';
    form.elements.asset_type.value = 'crypto';
    form.elements.cost_currency.value = 'USD';
    form.elements.avg_cost.value = '0';
    form.elements.price_source.value = 'manual';
    document.querySelector('[data-holding-form-title]').textContent = 'New holding';
  }

  function setToday() {
    document.querySelectorAll('input[type="date"]').forEach((dateField) => {
      dateField.value = getLocalDateInputValue();
    });
  }

  function getLocalDateInputValue() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function formToObject(form) {
    return Array.from(new FormData(form).entries()).reduce((values, entry) => {
      values[entry[0]] = entry[1].trim();
      return values;
    }, {});
  }

  function removeBlankFields(values) {
    Object.keys(values).forEach((key) => {
      if (values[key] === '') {
        delete values[key];
      }
    });
  }

  function fillForm(form, values) {
    Array.from(form.elements).forEach((field) => {
      if (!field.name || values[field.name] === undefined) {
        return;
      }

      field.value = values[field.name];
    });
  }

  function formatMoney(value, currency) {
    return `${Number(value || 0).toLocaleString(undefined, {
      maximumFractionDigits: 2,
    })} ${currency}`;
  }

  function formatSignedMoney(value, currency) {
    const numberValue = Number(value || 0);
    const prefix = numberValue > 0 ? '+' : '';
    return `${prefix}${formatMoney(numberValue, currency)}`;
  }

  function formatCurrencyBreakdown(values) {
    const entries = Object.entries(values || {}).filter((entry) => Number(entry[1] || 0) !== 0);

    if (entries.length === 0) {
      return '0';
    }

    return entries.map((entry) => formatMoney(entry[1], entry[0])).join(' / ');
  }

  function formatNumber(value) {
    return Number(value || 0).toLocaleString(undefined, {
      maximumFractionDigits: 8,
    });
  }

  function formatSignedNumber(value) {
    const numberValue = Number(value || 0);
    const prefix = numberValue > 0 ? '+' : '';
    return `${prefix}${formatNumber(numberValue)}`;
  }

  function formatPercent(value) {
    return `${formatNumber(Number(value || 0) * 100)}%`;
  }

  function formatPercentOrDash(value, alreadyPercent = false) {
    if (value === '' || value === undefined || value === null) {
      return '-';
    }

    return `${formatNumber(alreadyPercent ? value : Number(value || 0) * 100)}%`;
  }

  function formatNumberOrDash(value) {
    if (value === '' || value === undefined || value === null) {
      return '-';
    }

    return formatNumber(value);
  }

  function convertUsdForDisplay(valueUsd, currency, fx) {
    if (currency === 'THB') {
      return Number(valueUsd || 0) * Number((fx && fx.usd_thb) || 34.5);
    }

    return Number(valueUsd || 0);
  }

  function createEmptyText(message) {
    const empty = document.createElement('p');
    empty.className = 'muted-copy';
    empty.textContent = message;
    return empty;
  }

  function formatInitStatus(result) {
    if (result.created.length === 0 && result.updated.length === 0) {
      return 'Sheet schema is current';
    }

    const created = result.created.length;
    const updated = result.updated.length;
    return `${created} created, ${updated} updated`;
  }

  function setStatus(message, isError = false) {
    const status = document.querySelector('[data-status]');
    status.textContent = message;
    status.classList.toggle('is-error', isError);
  }

  function handleFailure(error) {
    setStatus(error.message || 'Request failed', true);
  }
</script>
